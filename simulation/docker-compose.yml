services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: orchestra-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t orchestra/health -m ok"]
      interval: 10s
      timeout: 5s
      retries: 5
